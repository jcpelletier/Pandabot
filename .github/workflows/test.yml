name: Test

on:
  pull_request:
    branches: [staging, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out pandabot-core
        uses: actions/checkout@v4
        with:
          repository: jcpelletier/pandabot-core
          path: pandabot-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}/pandabot-core
