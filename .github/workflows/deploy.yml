name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PANDA_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 100.65.72.102 >> ~/.ssh/known_hosts

      - name: Deploy to production
        run: |
          ssh genesis@100.65.72.102 \
            "sudo git -C /opt/discord-bot pull origin main && \
             sudo chown discord-bot:discord-bot /opt/discord-bot/scheduler.db && \
             sudo systemctl restart discord-bot pandabot-voice"

      - name: Post-deploy health check
        run: |
          sleep 15
          ssh genesis@100.65.72.102 \
            "sudo systemctl is-active discord-bot pandabot-voice"
